[package]
name = "ntnt"
version = "0.5.7"
edition = "2021"
authors = ["NTNT Language Team"]
description = "NTNT (Intent) - A programming language designed for AI-driven development"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ntntlang/ntnt"

[dependencies]
# Core utilities
thiserror = "1.0"
anyhow = "1.0.103"

# CLI
clap = { version = "4.4", features = ["derive", "env"] }
clap_complete = "4.4"

# TOML parsing (for stdlib docs)
toml = "0.8"

# Serialization (for AST export)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Pretty printing and colors
colored = "2.0"

# REPL support
rustyline = "13.0"

# Crypto
sha2 = "0.10"
hmac = "0.12"
bcrypt = "0.15"
uuid = { version = "1.6", features = ["v4"] }
rand = "0.9.5"
hex = "0.4"
base64 = "0.21"
aes-gcm = "0.10"
argon2 = "0.5"
totp-rs = { version = "5.5", features = ["gen_secret", "otpauth"] }

# Regex for pattern matching
regex = "1.10"

# Lazy statics for global state
lazy_static = "1.4"

# URL encoding/decoding
urlencoding = "2.1"

# HTTP Client
reqwest = { version = "0.12", features = ["blocking", "json", "multipart", "cookies"] }
encoding_rs = "0.8"
mime = "0.3"

# TLS certificate inspection
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pki-types = "1"
rustls-native-certs = "0.8.5"
# Security floor: retain compromised-intermediate-key distrust in new lockfiles.
rustls-webpki = { version = "0.103.16", default-features = false }
# Keep Rustls/ring, but do not enable lettre's bundled-root rustls-tls feature.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "pool", "rustls", "ring", "rustls-native-certs"] }
x509-parser = "0.18"

# HTTP Server (Axum + Tokio for high-concurrency in production)
# Security floor: avoid the AsyncFd I/O-safety advisory's affected Tokio lines.
tokio = { version = "1.53.3", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "compression-gzip", "trace", "fs", "timeout"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
# Shared immutable SSE frames and the streaming body adapter (DD-041).
bytes = "1.9"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Bounded monitoring HTTP transport; ordinary fetch remains on reqwest.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

# Worker pool channels and CPU detection
flume = "0.11"
num_cpus = "1.16"

# Crossbeam channels (multi-producer, multi-consumer, select support)
crossbeam-channel = "0.5"

# HTTP Server (tiny_http for synchronous test mode)
tiny_http = "0.12"

# Ctrl+C handling
ctrlc = "3.4"

# Database
deadpool-postgres = "0.14"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
postgres = { version = "0.19", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
rusqlite = { version = "0.31", features = ["bundled", "hooks", "limits"] }
rust_decimal = { version = "1.43", features = ["db-postgres", "db-tokio-postgres"] }
chrono = "0.4"
chrono-tz = "0.10.4"

# Redis/Valkey KV store
redis = "0.27"

# JWT for auth
# jsonwebtoken 10 requires an explicit signing/verification provider.
# AWS-LC preserves the supported JWT algorithms without adding the vulnerable rsa crate.
jsonwebtoken = { version = "10.3.0", features = ["aws_lc_rs"] }
# Security floor: avoid RUSTSEC-2026-0414's exponential wikilink event growth.
pulldown-cmark = "0.13.5"
hickory-resolver = "0.26.2"
socket2 = "0.6"
zeroize = { version = "1.8.2", features = ["serde"] }
tempfile = "3.24"
qrcode = { version = "0.14.1", default-features = false }
sqlparser = { version = "=0.62.0", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
# Let JWT's AWS-LC provider build without a separately installed NASM assembler.
aws-lc-rs = { version = "1.18", features = ["prebuilt-nasm"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_IO"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
# Doc comment scanner (build.rs extracts /// @ntnt blocks)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
pretty_assertions = "1.4"
serde_json = "1.0"
reqwest = { version = "0.12", features = ["blocking"] }
libc = "0.2"
rcgen = "0.13"

[[bin]]
name = "ntnt"
path = "src/main.rs"

[features]
default = []
redis-tests = []  # Enable to run Redis integration tests (requires running Redis server)

[profile.release]
opt-level = 3
lto = true

# Fast release builds for development testing (no LTO)
# Usage: cargo build --profile dev-release
[profile.dev-release]
inherits = "release"
lto = false
incremental = true

[package]
name = "ntnt"
version = "0.5.1"
edition = "2021"
authors = ["NTNT Language Team"]
description = "NTNT (Intent) - A programming language designed for AI-driven development"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ntntlang/ntnt"

[dependencies]
# Core utilities
thiserror = "1.0"
anyhow = "1.0"

# CLI
clap = { version = "4.4", features = ["derive", "env"] }
clap_complete = "4.4"

# TOML parsing (for stdlib docs)
toml = "0.8"

# Serialization (for AST export)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Pretty printing and colors
colored = "2.0"

# REPL support
rustyline = "13.0"

# Crypto
sha2 = "0.10"
hmac = "0.12"
bcrypt = "0.15"
uuid = { version = "1.6", features = ["v4"] }
rand = "0.8"
hex = "0.4"
base64 = "0.21"
aes-gcm = "0.10"
argon2 = "0.5"
totp-rs = { version = "5.5", features = ["gen_secret", "otpauth"] }

# Regex for pattern matching
regex = "1.10"

# Lazy statics for global state
lazy_static = "1.4"

# URL encoding/decoding
urlencoding = "2.1"

# HTTP Client
reqwest = { version = "0.11", features = ["blocking", "json", "multipart", "cookies"] }

# TLS certificate inspection
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pki-types = "1"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "pool", "rustls-tls"] }
webpki-root-certs = "1"
x509-parser = "0.18"

# HTTP Server (Axum + Tokio for high-concurrency in production)
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "compression-gzip", "trace", "fs", "timeout"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }

# Worker pool channels and CPU detection
flume = "0.11"
num_cpus = "1.16"

# Crossbeam channels (multi-producer, multi-consumer, select support)
crossbeam-channel = "0.5"

# HTTP Server (tiny_http for synchronous test mode)
tiny_http = "0.12"

# Ctrl+C handling
ctrlc = "3.4"

# Database
deadpool-postgres = "0.14"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
postgres = { version = "0.19", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
rusqlite = { version = "0.31", features = ["bundled"] }
rust_decimal = { version = "1.36", features = ["db-postgres", "db-tokio-postgres"] }
chrono = "0.4"
chrono-tz = "0.10.4"

# Redis/Valkey KV store
redis = "0.27"

# JWT for auth
jsonwebtoken = "9"
pulldown-cmark = "0.13.0"
hickory-resolver = "0.24.4"
socket2 = "0.6"

[build-dependencies]
# Doc comment scanner (build.rs extracts /// @ntnt blocks)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
pretty_assertions = "1.4"
serde_json = "1.0"
reqwest = { version = "0.11", features = ["blocking"] }
libc = "0.2"
rcgen = "0.13"

[[bin]]
name = "ntnt"
path = "src/main.rs"

[features]
default = []
redis-tests = []  # Enable to run Redis integration tests (requires running Redis server)

[profile.release]
opt-level = 3
lto = true

# Fast release builds for development testing (no LTO)
# Usage: cargo build --profile dev-release
[profile.dev-release]
inherits = "release"
lto = false
incremental = true

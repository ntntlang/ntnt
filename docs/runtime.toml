# NTNT Runtime & CLI Reference
# Source of truth for runtime configuration and CLI documentation
# Auto-generates: docs/RUNTIME_REFERENCE.md

[meta]
# Note: Version is read from Cargo.toml at compile time
description = "Runtime configuration, environment variables, and CLI commands for NTNT"

# =============================================================================
# ENVIRONMENT VARIABLES
# =============================================================================

[env_vars]
description = "Environment variables that control NTNT runtime behavior"

[env_vars.NTNT_ENV]
values = ["development", "production", "prod"]
default = "development (when unset)"
description = "Controls runtime mode. Production mode disables hot-reload for better performance."
example = "NTNT_ENV=production ntnt run server.tnt"
affects = ["hot-reload"]

[env_vars.NTNT_SECRETS_PROVIDER]
values = ["env", "unix-socket"]
default = "env"
description = "Selects the provider behind the opt-in `std/secrets` API. This setting does not affect `std/env`, `get_env`, `load_env`, or existing `.env` workflows. Provider configuration is evaluated only when an application calls `get_secret` or `require_secret`. The exact-name environment provider is development-only and is rejected when `NTNT_ENV` is `production` or `prod`; that restriction applies only to `std/secrets`. `unix-socket` is Unix-only and talks to any local secrets agent implementing the documented protocol, without depending directly on a secrets backend."
example = "NTNT_SECRETS_PROVIDER=unix-socket ntnt run server.tnt"
affects = ["std-secrets", "security"]

[env_vars.NTNT_SECRETS_SOCKET_ENDPOINTS]
type = "comma-separated absolute Unix socket paths"
default = "unset (required for unix-socket)"
description = "Ordered local secrets-agent endpoints for secret lookup. One through eight unique paths are allowed. Each endpoint is tried twice, and failover occurs only for bounded unavailable results. Production paths must be beneath the host-controlled `/run/ntnt-secrets` root; raw paths are never included in runtime diagnostics."
example = "NTNT_SECRETS_SOCKET_ENDPOINTS=/run/ntnt-secrets/secrets.sock"
affects = ["std-secrets", "security"]

[env_vars.NTNT_SECRETS_AUTHORIZATION_SCOPE]
type = "opaque ASCII deployment identifier"
default = "unset (required for unix-socket)"
description = "Trusted non-credential deployment scope expected in every secrets-agent response. It detects endpoint miswiring but is not authentication and is never rendered in diagnostics. Leading or trailing whitespace is rejected."
example = "NTNT_SECRETS_AUTHORIZATION_SCOPE=deployment-a"
affects = ["std-secrets", "security"]

[env_vars.NTNT_SECRETS_TIMEOUT_MS]
type = "integer (milliseconds)"
default = "1000"
description = "Per-attempt Unix-socket connect, write, and read timeout. Values must be between 10 and 10000 milliseconds."
example = "NTNT_SECRETS_TIMEOUT_MS=500"
affects = ["std-secrets", "security"]

[env_vars.NTNT_TIMEOUT]
type = "integer (seconds)"
default = "30"
description = "Request timeout for HTTP server in seconds."
example = "NTNT_TIMEOUT=60 ntnt run server.tnt"
cli_override = "--timeout"

[env_vars.NTNT_ALLOW_PRIVATE_IPS]
values = ["true"]
default = "unset (disabled — private IPs blocked)"
description = "Allow `fetch()` to connect to private/internal IP ranges (10.x, 172.16-31.x, 192.168.x, 127.x). Required for Docker inter-container communication (e.g., calling a sidecar at 172.19.0.1). Disabled by default to prevent SSRF attacks. This does not enable `std/net` or `std/netmon` probes; use `NTNT_NET_ALLOW_PRIVATE=1` plus per-call `allow_private: true` for those."
example = "NTNT_ALLOW_PRIVATE_IPS=true ntnt run server.tnt"
affects = ["http-client", "security"]

[env_vars.NTNT_NETMON_ENABLE]
values = ["1", "true", "yes", "on"]
default = "unset (disabled — std/netmon protocol calls rejected)"
description = "Explicitly enables std/netmon protocol calls for the process. This gate is required for public and private targets. Private/internal targets additionally require NTNT_NET_ALLOW_PRIVATE=1 and per-call allow_private: true."
example = "NTNT_NETMON_ENABLE=1 NTNT_NET_ALLOW_PRIVATE=1 ntnt run monitor.tnt"
affects = ["std-netmon", "security"]

[env_vars.NTNT_NET_ALLOW_PRIVATE]
values = ["1", "true", "yes"]
default = "unset (disabled — private targets blocked)"
description = "Process-level opt-in for `std/net` probes (`ping`, `tcp_connect`, `reachable`, `port_scan`, `tls_info`, `traceroute`) and `std/netmon` protocol calls against private/internal targets. Each call must also pass `allow_private: true`; std/netmon independently requires `NTNT_NETMON_ENABLE=1`. Special-purpose targets such as cloud metadata, multicast, broadcast, unspecified, and documentation ranges remain blocked. This is separate from `NTNT_ALLOW_PRIVATE_IPS`, which only applies to `fetch()`."
example = "NTNT_NET_ALLOW_PRIVATE=1 ntnt run monitor.tnt"
affects = ["std-net", "std-netmon", "security"]

[env_vars.NTNT_PROCESS_ENABLE]
values = ["1", "true", "yes", "on"]
default = "unset (disabled — std/process calls rejected)"
description = "Explicitly enables native process execution through `std/process`. Arguments are passed directly to approved executables without an implicit shell."
example = "NTNT_PROCESS_ENABLE=1 NTNT_PROCESS_ALLOW=/usr/bin/ffmpeg ntnt run audio.tnt"
affects = ["std-process", "security"]

[env_vars.NTNT_PROCESS_ALLOW]
type = "platform-path-delimited executable paths"
default = "unset (all executables allowed after NTNT_PROCESS_ENABLE opt-in)"
description = "Optional exact allowlist for `std/process`, separated with the platform path delimiter (`:` on Unix and `;` on Windows). Both configured entries and requested executables are canonicalized before comparison. On Windows, `.bat` and `.cmd` files are rejected because the OS invokes `cmd.exe` implicitly; explicitly allowlist and invoke `cmd.exe` only when shell authority is intentional."
example = "NTNT_PROCESS_ENABLE=1 NTNT_PROCESS_ALLOW=/usr/bin/ffmpeg:/usr/bin/sox ntnt run audio.tnt"
affects = ["std-process", "security"]

[env_vars.NTNT_MAX_RECURSION]
type = "integer"
default = "256"
description = "Maximum recursion depth for function calls. Prevents stack overflow from runaway recursion."
example = "NTNT_MAX_RECURSION=512 ntnt run server.tnt"
affects = ["runtime"]

[env_vars.NTNT_TYPE_MODE]
values = ["strict", "warn", "forgiving"]
default = "warn"
description = "Controls runtime behavior for type mismatches. `strict`: type mismatches crash (fail-closed, recommended for auth/payments). `warn`: log `[WARN]` and continue (default). `forgiving`: silent degradation (pre-v0.4 behavior). See [Type Safety Modes](#type-safety-modes)."
example = "NTNT_TYPE_MODE=strict ntnt run server.tnt"
affects = ["type-checking", "runtime"]

[env_vars.NTNT_LINT_MODE]
values = ["default", "warn", "strict"]
default = "default"
description = "Controls lint strictness for type annotations. `default`: only check annotated code. `warn`: also warn about missing annotations (non-fatal). `strict`: missing annotations are errors. CLI flags (`--strict`, `--warn-untyped`) override this."
example = "NTNT_LINT_MODE=strict ntnt lint server.tnt"
affects = ["lint", "type-checking"]

[env_vars.NTNT_STRICT]
values = ["1", "true"]
default = "unset (disabled)"
description = "**Deprecated — use `NTNT_LINT_MODE=strict` instead.** Enable strict type checking. Still works but emits a deprecation warning."
example = "NTNT_STRICT=1 ntnt run server.tnt"
affects = ["type-checking", "lint"]

[env_vars.NTNT_DB_POOL_SIZE]
values = ["any positive integer"]
default = "5"
description = "Maximum number of connections per shared PostgreSQL database pool. Each worker keeps its own process-local pools keyed by connection string, so total connections = num_workers × num_databases × pool_size. Repeated connect(url) calls within a worker reuse the same shared pool. For multi-worker production deployments with multiple databases, keep this low (2-5) to avoid exhausting PostgreSQL max_connections."
example = "NTNT_DB_POOL_SIZE=3 ntnt run server.tnt"
affects = ["database", "postgres"]

# =============================================================================
# TYPE SAFETY MODES (DD-009)
# =============================================================================

[type_safety_modes]
content = """ntnt provides two independent axes for type control, configured via environment variables.

### Axis 1: Runtime Type Mode (`NTNT_TYPE_MODE`)

Controls what happens when types mismatch at runtime (e.g., bad data from a database, wrong API response type).

| Mode | Behavior | Use Case |
|------|----------|----------|
| `strict` | Type mismatches crash the request (fail-closed) | Apps with auth, payments, safety-critical logic |
| `warn` | Log `[WARN]` to stderr and continue **(default)** | Production apps with log monitoring |
| `forgiving` | Silent degradation, no warnings | Content sites where uptime > correctness |

```bash
# Crash on type mismatches (safest)
NTNT_TYPE_MODE=strict ntnt run server.tnt

# Log warnings and continue (default)
NTNT_TYPE_MODE=warn ntnt run server.tnt

# Silent degradation (pre-v0.4 behavior)
NTNT_TYPE_MODE=forgiving ntnt run server.tnt
```

**Affected operations:** index (`[]`) type mismatch, `for..in` on non-collections, field access on wrong types, template expression errors. Warnings are deduplicated per evaluation context — the same mismatch won't spam 50 times in a loop.

**Security note:** Apps with authentication, authorization, or financial logic should use `strict`. Forgiving mode is fail-open — a type mismatch on a permission check can silently bypass it.

### Axis 2: Lint Mode (`NTNT_LINT_MODE`)

Controls how the linter treats missing type annotations.

| Mode | Behavior | CI Exit Code |
|------|----------|--------------|
| `default` | Only report errors in annotated code | 0 (if no type conflicts) |
| `warn` | Also warn about missing annotations | 0 (warnings are non-fatal) |
| `strict` | Missing annotations are errors | Non-zero on missing annotations |

```bash
# Default: only check annotated code
ntnt lint app.tnt

# Warn about missing annotations (non-fatal)
ntnt lint --warn-untyped app.tnt
NTNT_LINT_MODE=warn ntnt lint app.tnt

# Require all annotations (CI-safe)
ntnt lint --strict app.tnt
NTNT_LINT_MODE=strict ntnt lint app.tnt
```

### Precedence

```
CLI flag > Environment variable > ntnt.toml > built-in default
```

### Docker Configuration

```yaml
# SaaS app with auth + payments
environment:
  - NTNT_TYPE_MODE=strict
  - NTNT_LINT_MODE=strict
  - NTNT_ENV=production

# Content site / blog
environment:
  - NTNT_TYPE_MODE=warn
  - NTNT_LINT_MODE=default
  - NTNT_ENV=production
```"""

# =============================================================================
# HOT-RELOAD
# =============================================================================

[hot_reload]
description = "Automatic code reloading during development"
default = "enabled"
disable = "Set NTNT_ENV=production"

[hot_reload.tracked_files]
description = "Files monitored for changes"
files = [
    "Main server file (.tnt)",
    "Imported local modules (import from \"./...\")",
    "File-based route files (routes/*.tnt)",
    "Route imported modules"
]

[hot_reload.behavior]
trigger = "Changes detected on next HTTP request"
action = "Full reload of main file and all imports"
output = "[hot-reload] <file> changed, reloading..."

# =============================================================================
# HTTP SERVER
# =============================================================================

[http_server]
description = "Built-in HTTP server runtime behavior"

[http_server.request_object]
description = "Properties available on the request object passed to handlers"

[http_server.request_object.properties]
method = "HTTP method (GET, POST, etc.)"
path = "URL path without query string"
params = "Route parameters map (e.g., req.params[\"id\"])"
query_params = "Query string parameters map"
headers = "Request headers map"
body = "Raw request body string"
ip = "Client IP address (supports X-Forwarded-For)"
id = "Request ID (from X-Request-ID header or auto-generated)"

[http_server.defaults]
port = "8080 (convention, set in listen() call)"
timeout = "30 seconds (override with NTNT_TIMEOUT or --timeout)"

# =============================================================================
# FILE-BASED ROUTING
# =============================================================================

[file_based_routing]
description = "Convention-based routing from directory structure"

[file_based_routing.conventions]
routes_dir = "routes/"
middleware_dir = "middleware/"
index_file = "index.tnt maps to parent path (e.g., routes/index.tnt -> /)"
dynamic_segment = "[param].tnt maps to {param} (e.g., [id].tnt -> /{id})"
nested_dynamic = "Supports nested dynamics (e.g., users/[id]/posts/[postId].tnt)"

[file_based_routing.handler_functions]
description = "Export functions named after HTTP methods"
methods = ["get", "post", "put", "delete", "patch", "head", "options"]
example = "fn get(req) { ... } in routes/users.tnt handles GET /users"

[file_based_routing.middleware]
description = "Middleware files in middleware/ directory are auto-applied"
naming = "Files are applied in alphabetical order (e.g., 01_auth.tnt, 02_logging.tnt)"
function = "Export a function named 'middleware' that receives the request"

# =============================================================================
# PROJECT STRUCTURE
# =============================================================================

[project_structure]
description = "Recommended project layout for NTNT applications"

[project_structure.layout]
example = """
my-app/
├── server.tnt          # Main server file
├── server.intent       # Intent specification (matches server.tnt)
├── routes/             # File-based routes
│   ├── index.tnt       # GET /
│   ├── about.tnt       # GET /about
│   └── api/
│       ├── users.tnt   # GET/POST /api/users
│       └── [id].tnt    # GET /api/users/{id}
├── middleware/         # Auto-applied middleware
│   └── 01_logging.tnt
├── lib/                # Shared library code
│   └── utils.tnt
├── views/              # HTML templates
│   └── layout.html
└── public/             # Static assets (serve_static)
"""

[project_structure.intent_files]
description = "Intent files are linked by filename"
convention = "server.tnt <-> server.intent"
recommendation = "Use a single .intent file per application for full context"

# =============================================================================
# CLI COMMANDS
# =============================================================================

[cli]
description = "NTNT command-line interface"

# --- Run ---
[cli.run]
command = "ntnt run <FILE>"
description = "Execute an NTNT source file"
options = [
    { name = "--timeout", short = "", type = "seconds", default = "30", description = "Request timeout for HTTP server (also: NTNT_TIMEOUT)" }
]
example = "ntnt run server.tnt"

# --- Lint ---
[cli.lint]
command = "ntnt lint <PATH>"
description = "Check source file(s) for syntax errors and common mistakes"
options = [
    { name = "--quiet", short = "-q", type = "flag", description = "Show only errors, not warnings or suggestions" },
    { name = "--fix", short = "", type = "flag", description = "Output auto-fix suggestions as JSON patch" },
    { name = "--warn-untyped", short = "", type = "flag", description = "Enable strict typechecker warnings without failing the build: warns on missing type annotations and other strict-mode issues (e.g., Float→Int precision-loss, complex interpolation). Exit code remains 0. Also: `NTNT_LINT_MODE=warn`." },
    { name = "--strict", short = "", type = "flag", description = "Require type annotations on all functions — missing annotations are errors (non-zero exit). Also: `NTNT_LINT_MODE=strict`. Replaces deprecated `NTNT_STRICT`." }
]
example = "ntnt lint server.tnt"

# --- Validate ---
[cli.validate]
command = "ntnt validate <PATH>"
description = "Validate source and output results as JSON (for tooling)"
example = "ntnt validate server.tnt"

# --- Inspect ---
[cli.inspect]
command = "ntnt inspect <PATH>"
description = "Output project structure as JSON (for AI agents)"
options = [
    { name = "--pretty", short = "-p", type = "flag", description = "Pretty-print the JSON output" }
]
example = "ntnt inspect server.tnt --pretty"

# --- Test ---
[cli.test]
command = "ntnt test <FILE>"
description = "Run HTTP tests against a server file"
options = [
    { name = "--get", short = "", type = "PATH", description = "Make a GET request to the specified path" },
    { name = "--post", short = "", type = "PATH", description = "Make a POST request to the specified path" },
    { name = "--put", short = "", type = "PATH", description = "Make a PUT request to the specified path" },
    { name = "--delete", short = "", type = "PATH", description = "Make a DELETE request to the specified path" },
    { name = "--body", short = "", type = "JSON", description = "Request body for POST/PUT requests" },
    { name = "--port", short = "", type = "number", default = "18080", description = "Port to run the test server on" },
    { name = "--verbose", short = "-v", type = "flag", description = "Show verbose output including headers" }
]
example = "ntnt test server.tnt --get / --get /api/users"

# --- Docs ---
[cli.docs]
command = "ntnt docs [QUERY]"
description = "Look up documentation for stdlib modules or functions"
options = [
    { name = "--validate", short = "", type = "flag", description = "Validate that all stdlib functions are documented" },
    { name = "--generate", short = "", type = "flag", description = "Regenerate reference docs from source annotations and TOML, and sync agent instruction files (CLAUDE.md, copilot-instructions.md) from AI_AGENT_GUIDE.md" },
    { name = "--json", short = "", type = "flag", description = "Output as JSON (for tooling)" }
]
examples = [
    "ntnt docs std/string",
    "ntnt docs split",
    "ntnt docs --generate"
]

# --- Completions ---
[cli.completions]
command = "ntnt completions <SHELL>"
description = "Generate shell completions"
shells = ["bash", "zsh", "fish", "powershell", "elvish"]
example = "ntnt completions zsh >> ~/.zshrc"

# --- Intent Check ---
[cli.intent_check]
command = "ntnt intent check <FILE>"
description = "Run intent tests against implementation"
options = [
    { name = "--intent", short = "-i", type = "PATH", description = "Path to intent file (default: <name>.intent)" },
    { name = "--port", short = "", type = "number", default = "18081", description = "Port to run the test server on" },
    { name = "--verbose", short = "-v", type = "flag", description = "Show scenario pass/fail status" },
    { name = "-vv", short = "", type = "flag", description = "Show all assertions and term resolution" },
    { name = "--json", short = "", type = "flag", description = "Output results as JSON" }
]
examples = [
    "ntnt intent check server.tnt",
    "ntnt intent check server.tnt -v",
    "ntnt intent check server.tnt -vv"
]

# --- Intent Coverage ---
[cli.intent_coverage]
command = "ntnt intent coverage <FILE>"
description = "Show which features have implementations"
options = [
    { name = "--intent", short = "-i", type = "PATH", description = "Path to intent file (default: <name>.intent)" }
]
example = "ntnt intent coverage server.tnt"

# --- Intent Init ---
[cli.intent_init]
command = "ntnt intent init <INTENT_FILE>"
description = "Generate code scaffolding from intent file"
options = [
    { name = "--output", short = "-o", type = "PATH", description = "Output file (default: prints to stdout)" }
]
example = "ntnt intent init project.intent -o server.tnt"

# --- Intent Studio ---
[cli.intent_studio]
command = "ntnt intent studio <INTENT_FILE>"
description = "Visual preview with live test execution"
options = [
    { name = "--port", short = "-p", type = "number", default = "3001", description = "Port for the studio server" },
    { name = "--app-port", short = "-a", type = "number", default = "8081", description = "Port where the application server is running" },
    { name = "--no-open", short = "", type = "flag", description = "Don't automatically open the browser" }
]
example = "ntnt intent studio server.intent"

# --- Worker ---
[cli.worker]
command = "ntnt worker <FILE>"
description = "Start background job workers for jobs defined in a .tnt file. Loads the source file (registering all job definitions), then starts processing jobs from the queue until interrupted with Ctrl-C."
options = [
    { name = "--concurrency", short = "", type = "number", default = "1", description = "Number of concurrent worker threads" },
    { name = "--queues", short = "", type = "STRING", description = "Comma-separated list of queues to process (default: all)" },
    { name = "--poll-interval", short = "", type = "number", default = "1000", description = "Poll interval in milliseconds" }
]
examples = [
    "ntnt worker server.tnt",
    "ntnt worker server.tnt --concurrency 4",
    "ntnt worker server.tnt --queues emails,payments"
]

# --- Jobs ---
[cli.jobs]
command = "ntnt jobs <SUBCOMMAND> <FILE> [OPTIONS]"
description = "Manage and inspect the job queue. All subcommands take the .tnt file that has the queue configuration as the first argument."

# --- Jobs Status ---
[cli.jobs_status]
command = "ntnt jobs status <FILE>"
description = "Show job queue status with counts by status (pending, scheduled, active, completed, retrying, dead, cancelled)."
example = "ntnt jobs status server.tnt"

# --- Jobs List ---
[cli.jobs_list]
command = "ntnt jobs list <FILE>"
description = "List individual jobs with optional status and queue filters. Results are sorted newest-first."
options = [
    { name = "--status", short = "", type = "STRING", description = "Filter by status (pending/scheduled/active/completed/retrying/dead/cancelled)" },
    { name = "--queue", short = "", type = "STRING", description = "Filter by queue name" },
    { name = "--limit", short = "", type = "number", default = "50", description = "Maximum number of jobs to show" },
    { name = "--format", short = "", type = "STRING", description = "Output format: json (default: table)" }
]
examples = [
    "ntnt jobs list server.tnt",
    "ntnt jobs list server.tnt --status=dead --limit=20",
    "ntnt jobs list server.tnt --queue=emails --format=json"
]

# --- Jobs Inspect ---
[cli.jobs_inspect]
command = "ntnt jobs inspect <FILE> <JOB_ID>"
description = "Show full details of a single job: id, type, queue, status, payload, attempts, retry config, timestamps, and error message if any."
example = "ntnt jobs inspect server.tnt abc12345"

# --- Jobs Retry ---
[cli.jobs_retry]
command = "ntnt jobs retry <FILE> <JOB_ID>"
description = "Re-queue a failed or dead job for another attempt. Resets attempts to 0, clears error fields, and creates a new pending key. Accepts jobs with status 'retrying', 'dead', or 'failed' (backward compat)."
example = "ntnt jobs retry server.tnt abc12345"

# --- Jobs Cancel ---
[cli.jobs_cancel]
command = "ntnt jobs cancel <FILE> <JOB_ID>"
description = "Cancel a job. By default, only pending, scheduled, retrying, or failed jobs can be cancelled. Use --force to cancel an active (running) job — the worker will discard the result when it finishes."
options = [
    { name = "--force", short = "", type = "flag", description = "Force-cancel an active (running) job. The worker may still be executing, but the result will be discarded." }
]
examples = [
    "ntnt jobs cancel server.tnt abc12345",
    "ntnt jobs cancel server.tnt abc12345 --force"
]

# --- Jobs Clear ---
[cli.jobs_clear]
command = "ntnt jobs clear <FILE> --status=<STATUS>"
description = "Bulk delete jobs by status. Requires --status to prevent accidental wipe-all. Cannot clear active jobs (workers hold references). Use --older-than to only clear jobs older than a given duration."
options = [
    { name = "--status", short = "", type = "STRING", description = "Status of jobs to clear (required)" },
    { name = "--older-than", short = "", type = "DURATION", description = "Only clear jobs older than this duration (e.g., 7d, 24h, 30m)" },
    { name = "--yes", short = "", type = "flag", description = "Skip confirmation prompt" }
]
examples = [
    "ntnt jobs clear server.tnt --status=completed",
    "ntnt jobs clear server.tnt --status=dead --older-than=7d --yes"
]

# --- Parse (debug) ---
[cli.parse]
command = "ntnt parse <FILE>"
description = "Parse file and show AST (for debugging)"
options = [
    { name = "--json", short = "", type = "flag", description = "Output AST as JSON" }
]
internal = true

# --- Lex (debug) ---
[cli.lex]
command = "ntnt lex <FILE>"
description = "Tokenize file and show tokens (for debugging)"
internal = true

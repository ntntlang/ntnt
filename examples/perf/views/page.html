<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{title}}</title>
</head>
<body>
  {{> nav}}
  <main>
    <h1>{{heading}}</h1>
    <section class="rows">
      {{#for row in rows}}
        {{> row_card row}}
      {{#empty}}
        <p>No rows.</p>
      {{/for}}
    </section>
  </main>
</body>
</html>

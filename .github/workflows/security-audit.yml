name: Scheduled dependency audit

on:
  schedule:
    # Off the hour; GitHub schedules use UTC and may start late.
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: RustSec scheduled audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Only this trusted, non-PR workflow may publish advisory issues.
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install cargo-audit
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit@0.22.2
          checksum: true
          fallback: none
      - name: Open issues for published advisories on the daily schedule
        # audit-check creates issues on schedule, but uses the Checks API on
        # other events. Manual runs deliberately skip issue/check publication.
        if: github.event_name == 'schedule'
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432 # Node 24
        with:
          token: ${{ github.token }}
      - name: Fail when the lockfile contains known vulnerabilities
        # The upstream scheduled reporter opens issues without failing its job.
        # Keep the actual cargo-audit exit status as well; do not mask findings.
        working-directory: ${{ runner.temp }}
        run: cargo audit --file "$GITHUB_WORKSPACE/Cargo.lock"

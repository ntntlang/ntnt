name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on rapid pushes to the same PR; never cancel main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      examples: ${{ steps.filter.outputs.examples }}
      docs: ${{ steps.filter.outputs.docs }}
      macos_socket: ${{ steps.filter.outputs.macos_socket }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - '.github/workflows/ci.yml'
              - '.config/nextest.toml'
            examples:
              - 'examples/**'
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            docs:
              - 'docs/**'
              - 'stdlib.toml'
              - 'src/**'
            macos_socket:
              - 'src/stdlib/secrets/socket.rs'
              - '.github/workflows/release.yml'

  macos-release-socket:
    name: macOS Release Socket Regression
    needs: changes
    if: needs.changes.outputs.macos_socket == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-release-socket

      - name: Run release-profile socket framing regression
        run: cargo test --release --locked --lib stdlib::secrets::socket::tests::socket_provider_rejects_malformed_or_ambiguous_frames -- --exact --nocapture --test-threads=1

  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Build
        run: cargo build --locked

      # nextest runs each test in its own process, which removes the two
      # documented causes of the old parallel-test races (std::env mutation
      # across threads, eb9f77d; shared JOB_RUNTIME state, ef3d79d/DD-059) —
      # every process gets its own environment and its own globals. Local
      # network fixtures are grouped/serialized via .config/nextest.toml.
      - name: Run tests
        run: cargo nextest run --locked
        env:
          RUST_MIN_STACK: 8388608

      # nextest does not run doctests; keep them covered (currently zero,
      # this guards any future additions).
      - name: Run doctests
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --doc --locked

  auth-backends:
    name: Auth Backend Contracts
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ntnt_auth_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ntnt
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: auth-backends

      - name: Run auth storage contract tests against Postgres and Redis
        run: |
          cargo test --locked --lib test_auth_storage_contract_postgres_round_trip_all_record_types -- --test-threads=1 --nocapture
          cargo test --locked --lib test_auth_storage_contract_redis_round_trip_all_record_types -- --test-threads=1 --nocapture
          cargo test --locked --lib test_postgres_migrates_legacy_password_reset_tokens_without_replay_copy -- --test-threads=1 --nocapture
          cargo test --locked --lib test_redis_purges_legacy_password_reset_keys_on_upgrade -- --test-threads=1 --nocapture
          cargo test --locked --lib test_postgres_magic_link_storage_is_atomic_under_concurrency -- --test-threads=1 --nocapture
          cargo test --locked --lib test_redis_magic_link_storage_is_atomic_under_concurrency -- --test-threads=1 --nocapture
          cargo test --locked --lib test_postgres_password_reset_consume_is_one_time_under_concurrency -- --test-threads=1 --nocapture
          cargo test --locked --lib test_redis_password_reset_consume_is_one_time_under_concurrency -- --test-threads=1 --nocapture
          cargo test --locked --lib test_auth_rate_limit_contract_postgres -- --test-threads=1 --nocapture
          cargo test --locked --lib test_auth_rate_limit_contract_redis -- --test-threads=1 --nocapture
          cargo test --locked --lib test_magic_link_delivery_cleanup_race_postgres -- --test-threads=1 --nocapture
          cargo test --locked --lib test_magic_link_delivery_cleanup_race_redis -- --test-threads=1 --nocapture
          cargo test --locked --lib test_set_local_password_revokes_outstanding_one_time_tokens -- --test-threads=1 --nocapture
          cargo test --locked --lib test_password_reset_revokes_outstanding_magic_links -- --test-threads=1 --nocapture
        env:
          RUST_MIN_STACK: 8388608
          NTNT_AUTH_TEST_POSTGRES_URL: postgres://postgres:ntnt@localhost:5432/ntnt_auth_test
          NTNT_AUTH_TEST_REDIS_URL: redis://127.0.0.1:6379/0

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # One release build serves both example linting and doc validation.
  # The release target/ gets its own cache key so it never collides with
  # the debug artifacts cached by the test job.
  docs-and-examples:
    name: Validate Docs & Examples
    needs: changes
    if: needs.changes.outputs.examples == 'true' || needs.changes.outputs.docs == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Build release
        run: cargo build --release --locked

      - name: Lint examples
        run: ./target/release/ntnt lint examples/

      - name: Validate stdlib.toml
        run: ./target/release/ntnt docs --validate

      - name: Generate docs and check for drift
        run: |
          ./target/release/ntnt docs --generate
          DRIFT=0
          for file in docs/STDLIB_REFERENCE.md docs/SYNTAX_REFERENCE.md docs/IAL_REFERENCE.md; do
            if ! git diff --quiet "$file" 2>/dev/null; then
              echo "::error::$file is out of date. Run 'ntnt docs --generate' and commit."
              git diff "$file"
              DRIFT=1
            fi
          done
          if [ "$DRIFT" = "1" ]; then
            exit 1
          fi

  # Summary job — use this as the single required status check in branch protection.
  # Always runs. Passes when all non-skipped jobs passed.
  ci-status:
    name: CI Status
    if: always()
    needs: [test, auth-backends, lint, docs-and-examples, macos-release-socket]
    runs-on: ubuntu-latest
    steps:
      - name: Check CI results
        run: |
          results=("${{ needs.test.result }}" "${{ needs['auth-backends'].result }}" "${{ needs.lint.result }}" "${{ needs['docs-and-examples'].result }}" "${{ needs['macos-release-socket'].result }}")
          for result in "${results[@]}"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "::error::CI job failed or was cancelled: $result"
              exit 1
            fi
          done
          echo "✅ CI passed (skipped jobs are OK — no relevant file changes)"

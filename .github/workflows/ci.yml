name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      examples: ${{ steps.filter.outputs.examples }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - '.github/workflows/ci.yml'
            examples:
              - 'examples/**'
              - 'src/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            docs:
              - 'docs/**'
              - 'stdlib.toml'
              - 'src/**'

  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --locked

      - name: Run tests
        run: cargo test --locked -- --test-threads=1
        env:
          RUST_MIN_STACK: 8388608

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  examples:
    name: Validate Examples
    needs: changes
    if: needs.changes.outputs.examples == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release
        run: cargo build --release --locked

      - name: Lint examples
        run: ./target/release/ntnt lint examples/

  docs:
    name: Validate Documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release
        run: cargo build --release --locked

      - name: Validate stdlib.toml
        run: ./target/release/ntnt docs --validate

      - name: Generate docs and check for drift
        run: |
          ./target/release/ntnt docs --generate
          DRIFT=0
          for file in docs/STDLIB_REFERENCE.md docs/SYNTAX_REFERENCE.md docs/IAL_REFERENCE.md; do
            if ! git diff --quiet "$file" 2>/dev/null; then
              echo "::error::$file is out of date. Run 'ntnt docs --generate' and commit."
              git diff "$file"
              DRIFT=1
            fi
          done
          if [ "$DRIFT" = "1" ]; then
            exit 1
          fi

  # Summary job — use this as the single required status check in branch protection.
  # Always runs. Passes when all non-skipped jobs passed.
  ci-status:
    name: CI Status
    if: always()
    needs: [test, lint, examples, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Check CI results
        run: |
          results=("${{ needs.test.result }}" "${{ needs.lint.result }}" "${{ needs.examples.result }}" "${{ needs.docs.result }}")
          for result in "${results[@]}"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "::error::CI job failed or was cancelled: $result"
              exit 1
            fi
          done
          echo "✅ CI passed (skipped jobs are OK — no relevant file changes)"

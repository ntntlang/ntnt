name: TEMP Windows DNS stress
on:
  push:
    branches: [fix/dns-windows-excluded-ports]
jobs:
  stress:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fixed resolver and fixture regression
        run: |
          cargo test --locked --lib stdlib::net::dns_deadline:: -- --nocapture
      - name: Full DNS module stress
        run: |
          fails=0
          for i in $(seq 1 60); do
            cargo test -q --locked --lib stdlib::net::dns_deadline:: > out.txt 2>&1 || { fails=$((fails+1)); cat out.txt; }
          done
          echo "fix: $fails/60 failed"
          test "$fails" = 0

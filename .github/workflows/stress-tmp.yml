name: TEMP macOS secrets socket stress
on:
  push:
    branches: [fix/secrets-socket-root-cause]
jobs:
  stress:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Deterministic closed-agent regressions fail on old implementation
        run: |
          cp src/stdlib/secrets/socket.rs saved.rs
          git show fe52582:src/stdlib/secrets/socket.rs > baseline.rs
          python3 -c 'from pathlib import Path; p=Path("src/stdlib/secrets/socket.rs"); fixed=p.read_text(); old=Path("baseline.rs").read_text(); anchor="#[cfg(test)]\nmod tests"; p.write_text(old[:old.index(anchor)]+fixed[fixed.index(anchor):])'
          for test in socket_provider_reads_response_from_agent_that_already_closed socket_provider_rejects_buffered_extra_frame_after_agent_closed; do
            if cargo test --locked --lib "$test" -- --nocapture > regression.log 2>&1; then
              cat regression.log
              echo "Regression unexpectedly passed baseline: $test"
              exit 1
            fi
            cat regression.log
            if ! grep -q 'panicked at' regression.log; then exit 1; fi
          done
          mv saved.rs src/stdlib/secrets/socket.rs
      - name: Fixed regressions and restored original test budgets
        run: |
          cargo build --locked
          cargo test --locked --lib stdlib::secrets:: -- --nocapture
          cargo test --locked --test language_features_tests unix_socket -- --nocapture
      - name: e2e stress with original 250ms budget
        run: |
          fails=0
          for i in $(seq 1 60); do
            cargo test -q --locked --test language_features_tests test_unix_socket_secret_provider_end_to_end > out.txt 2>&1 || { fails=$((fails+1)); cat out.txt; }
          done
          echo "e2e-alone: $fails/60 failed"
          test "$fails" = 0
      - name: Frame and deadline regression under module load
        run: |
          fails=0
          for i in $(seq 1 30); do
            cargo test -q --locked --lib stdlib::secrets:: > out.txt 2>&1 || { fails=$((fails+1)); cat out.txt; }
          done
          echo "unit-load: $fails/30 failed"
          test "$fails" = 0

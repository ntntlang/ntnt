name: TEMP macOS secrets socket stress
on:
  push:
    branches: [fix/secrets-socket-root-cause]
jobs:
  stress:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked && cargo test --locked --no-run
      - name: e2e alone
        run: |
          fails=0
          for i in $(seq 1 150); do
            cargo test -q --locked --test language_features_tests test_unix_socket_secret_provider_end_to_end > out.txt 2>&1 || { fails=$((fails+1)); grep -E "Runtime error|panicked" out.txt | head -4; }
          done
          echo "e2e-alone: $fails/150 failed"
      - name: secrets unit tests under module load
        run: |
          fails=0
          for i in $(seq 1 60); do
            cargo test -q --locked --lib stdlib::secrets:: > out.txt 2>&1 || { fails=$((fails+1)); grep -E "panicked|left:|right:|FAILED" out.txt | head -6; }
          done
          echo "unit-load: $fails/60 failed"
      - name: secrets integration tests under load
        run: |
          fails=0
          for i in $(seq 1 15); do
            cargo test -q --locked --test language_features_tests > out.txt 2>&1 || { fails=$((fails+1)); grep -E "Runtime error|panicked|FAILED" out.txt | head -6; }
          done
          echo "e2e-load: $fails/15 failed"

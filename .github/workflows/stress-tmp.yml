name: TEMP macOS process stress
on:
  push:
    branches: [fix/process-timeout-flake]
jobs:
  stress:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build tests
        run: cargo test --locked --lib --no-run
      - name: Stress alone
        run: |
          fails=0
          for i in $(seq 1 150); do
            cargo test -q --locked --lib stdlib::process::tests::run_timeout_terminates_descendants_that_inherit_capture_pipes -- --exact > out.txt 2>&1 || { fails=$((fails+1)); grep -E "panicked|timed-out run|left|right" out.txt | head -8; }
          done
          echo "alone: $fails/150 failed"
      - name: Stress with full process module in parallel
        run: |
          fails=0
          for i in $(seq 1 40); do
            cargo test -q --locked --lib stdlib::process:: > out.txt 2>&1 || { fails=$((fails+1)); grep -E "FAILED|panicked|timed-out run|left:|right:" out.txt | head -10; }
          done
          echo "module: $fails/40 failed"
